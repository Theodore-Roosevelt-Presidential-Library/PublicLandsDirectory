<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Public lands map</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>html,body,#m{margin:0;height:100%}.lbl{position:absolute;z-index:1000;left:8px;bottom:8px;background:rgba(27,69,50,.9);color:#fff;font:600 12px/1.3 Arial,sans-serif;padding:5px 8px;border-radius:4px;text-decoration:none}</style>
</head><body><div id="m"></div><a id="lbl" class="lbl" target="_blank" rel="noopener" href="/">Public Lands Directory</a>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// Usage: /embed/map.html?site=<slug>[,<slug>...]   Shows one or more boundaries.
const slugs = (new URLSearchParams(location.search).get('site') || '').split(',').filter(Boolean);
const map = L.map('m');
L.tileLayer('https://basemap.nationalmap.gov/arcgis/rest/services/USGSTopo/MapServer/tile/{z}/{y}/{x}', { maxZoom: 16, attribution: 'USGS The National Map' }).addTo(map);
const group = L.featureGroup().addTo(map);
map.setView([39.5, -98.5], 4);
Promise.all(slugs.map(async (s) => {
  const site = await (await fetch(`/api/sites/${s}.json`)).json();
  if (site.boundaryUrl) {
    const f = await (await fetch(`/boundaries/${s}.geojson`)).json();
    L.geoJSON(f, { style: { color: '#1B4532', weight: 2, fillColor: '#8FC895', fillOpacity: .3 } }).bindPopup(`<a target="_blank" href="${site.url}">${site.name}</a>`).addTo(group);
  } else if (site.location) L.circleMarker([site.location.lat, site.location.lon], { radius: 7, color: '#fff', fillColor: '#E7805D', fillOpacity: 1 }).addTo(group);
  if (slugs.length === 1) { const a = document.getElementById('lbl'); a.textContent = site.name + ' · full guide'; a.href = site.url; }
})).then(() => { if (group.getLayers().length) map.fitBounds(group.getBounds(), { padding: [12, 12] }); });
</script></body></html>
